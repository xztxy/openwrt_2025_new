name: Update Checker ImmortalWrt

on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:
    inputs:
      force_build:
        description: Trigger a build even when the source commit is unchanged
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  actions: write

env:
  SOURCE_URL: https://github.com/immortalwrt/immortalwrt
  SOURCE_BRANCH: openwrt-24.10
  CACHE_SCOPE: immortalwrt-openwrt-24.10
  DISPATCH_EVENT: immortalwrt-updated

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Read upstream commit
        id: source
        run: |
          set -Eeuo pipefail
          commit_hash="$(git ls-remote "$SOURCE_URL" "refs/heads/$SOURCE_BRANCH" | awk 'NR == 1 { print $1 }')"
          if [[ -z "$commit_hash" ]]; then
            echo "Unable to resolve $SOURCE_URL branch $SOURCE_BRANCH" >&2
            exit 1
          fi
          mkdir -p .upstream-state
          printf '%s\n' "$commit_hash" > ".upstream-state/$CACHE_SCOPE"
          printf 'hash=%s\n' "$commit_hash" >> "$GITHUB_OUTPUT"

      - name: Restore upstream state
        id: upstream-cache
        uses: actions/cache@v4
        with:
          path: .upstream-state/${{ env.CACHE_SCOPE }}
          key: upstream-${{ env.CACHE_SCOPE }}-${{ steps.source.outputs.hash }}

      - name: Trigger firmware build
        if: steps.upstream-cache.outputs.cache-hit != 'true' || inputs.force_build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          gh api --method POST "repos/$GITHUB_REPOSITORY/dispatches" \
            -f event_type="$DISPATCH_EVENT" \
            -F "client_payload[source_commit]=${{ steps.source.outputs.hash }}"

      - name: Report unchanged source
        if: steps.upstream-cache.outputs.cache-hit == 'true' && !inputs.force_build
        run: echo "No upstream change detected"
