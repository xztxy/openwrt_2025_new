name: Update Checker ImmortalWrt

on:
  schedule:
    - cron: '47 */6 * * *'
  workflow_dispatch:
    inputs:
      force_build:
        description: Trigger builds even when the current upstream fingerprint succeeded
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  actions: write

jobs:
  check:
    uses: ./.github/workflows/_check-upstreams.yml
    with:
      primary_ref: immortalwrt/immortalwrt:openwrt-24.10
      upstream_refs: |
        immortalwrt/immortalwrt:openwrt-24.10
        immortalwrt/packages:openwrt-24.10
        immortalwrt/luci:openwrt-24.10
        openwrt/routing:openwrt-24.10
        openwrt/telephony:openwrt-24.10
        xztxy/New_lede_bianyi:main
        jerrykuku/luci-theme-argon:master
        jerrykuku/luci-app-argon-config:master
        sirpdboy/luci-theme-kucat:master
        sirpdboy/luci-app-kucat-config:master
        peditx/luci-theme-peditx:main
        gdy666/luci-app-lucky:main
        sirpdboy/luci-app-advanced:master
        sirpdboy/luci-app-autotimeset:main
        sirpdboy/luci-app-poweroffdevice:master
        nikkinikki-org/OpenWrt-nikki:main
        linkease/istore-ui:main
        linkease/istore:main
        Openwrt-Passwall/openwrt-passwall-packages:main
        Openwrt-Passwall/openwrt-passwall:main
        x-wrt/com.x-wrt:master
      build_targets: |
        immortalwrt-24.10-x86|immortalwrt-updated|Update-immortalwrt-24.10-x86
        immortalwrt-24.10-docker-x86|immortalwrt-docker-updated|Update-immortalwrt-24.10-docker-x86
      force_build: ${{ inputs.force_build || false }}
