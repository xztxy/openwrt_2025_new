name: Update Checker LEDE

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      force_build:
        description: Trigger a build even when the current upstream fingerprint succeeded
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  actions: write

jobs:
  check:
    uses: ./.github/workflows/_check-upstreams.yml
    with:
      primary_ref: coolsnowwolf/lede:master
      upstream_refs: |
        coolsnowwolf/lede:master
        coolsnowwolf/packages:master
        coolsnowwolf/luci:openwrt-25.12
        coolsnowwolf/routing:main
        coolsnowwolf/telephony:master
        xztxy/New_lede_bianyi:main
        jerrykuku/luci-theme-argon:master
        jerrykuku/luci-app-argon-config:master
        sirpdboy/luci-theme-kucat:master
        sirpdboy/luci-app-kucat-config:master
        peditx/luci-theme-peditx:main
        sirpdboy/luci-app-netdata:main
        gdy666/luci-app-lucky:main
        sirpdboy/luci-app-advancedplus:main
        sirpdboy/luci-app-autotimeset:main
        sirpdboy/luci-app-poweroffdevice:master
        kenzok8/small-package:main
        linkease/istore-ui:main
        linkease/istore:main
        x-wrt/com.x-wrt:master
        fw876/helloworld:master
        Openwrt-Passwall/openwrt-passwall-packages:main
        Openwrt-Passwall/openwrt-passwall:main
        Openwrt-Passwall/openwrt-passwall2:main
        vernesong/OpenClash:master
        nikkinikki-org/OpenWrt-nikki:main
      build_targets: |
        lede-x86|lede-updated
      force_build: ${{ inputs.force_build || false }}
