name: Maintenance Cleanup

on:
  schedule:
    - cron: '0 3 1 * *'
  workflow_dispatch:
    inputs:
      retain_days:
        description: Delete workflow runs older than this many days
        required: false
        default: '90'
        type: string
      minimum_runs:
        description: Always retain this many runs per workflow
        required: false
        default: '3'
        type: string

permissions:
  contents: read
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      RETAIN_DAYS: ${{ inputs.retain_days || '90' }}
      MINIMUM_RUNS: ${{ inputs.minimum_runs || '3' }}

    steps:
      - name: Delete old workflow runs safely
        run: |
          set -Eeuo pipefail
          [[ "$RETAIN_DAYS" =~ ^[0-9]+$ ]]
          [[ "$MINIMUM_RUNS" =~ ^[0-9]+$ ]]
          cutoff_epoch="$(date -u -d "$RETAIN_DAYS days ago" +%s)"
          declare -A workflow_counts=()

          while IFS=$'\t' read -r run_id workflow_name created_at; do
            current_count="${workflow_counts[$workflow_name]:-0}"
            current_count=$((current_count + 1))
            workflow_counts[$workflow_name]="$current_count"

            created_epoch="$(date -u -d "$created_at" +%s)"
            if (( current_count > MINIMUM_RUNS && created_epoch < cutoff_epoch )); then
              echo "Deleting run $run_id from $workflow_name ($created_at)"
              gh api --method DELETE "repos/$GITHUB_REPOSITORY/actions/runs/$run_id"
            fi
          done < <(
            gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs?per_page=100" \
              --jq '.workflow_runs[] | [.id, .name, .created_at] | @tsv'
          )
