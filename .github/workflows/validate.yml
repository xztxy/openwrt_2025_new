name: Validate Build Configuration

on:
  push:
    paths:
      - '.github/workflows/**'
      - 'scripts/**'
      - 'configs/**'
      - 'depends_ubuntu_2404'
      - 'tests/**'
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'scripts/**'
      - 'configs/**'
      - 'depends_ubuntu_2404'
      - 'tests/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Run workflow contract tests
        run: |
          python -m pip install --disable-pip-version-check PyYAML==6.0.3
          python -m unittest discover -s tests -v

      - name: Run actionlint
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

      - name: Parse shell scripts
        run: |
          find scripts -type f -print0 | while IFS= read -r -d '' script; do
            bash -n "$script"
          done
