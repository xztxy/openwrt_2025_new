name: immortalwrt-24.10-x86

on:
  repository_dispatch:
    types:
      - immortalwrt-updated
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.event.client_payload.target == 'immortalwrt-24.10-x86'
    uses: ./.github/workflows/_build-openwrt.yml
    with:
      source_url: https://github.com/immortalwrt/immortalwrt
      source_branch: openwrt-24.10
      source_commit: ${{ github.event.client_payload.source_commit }}
      build_fingerprint: ${{ github.event.client_payload.fingerprint }}
      target_board: x86
      target_subtarget: '64'
      config_file: configs/immortalwrt_24.10_x86.config
      diy_part1: scripts/sh/immortalwrt_diy-part1.sh
      diy_part2: scripts/immortalwrt_24.10_x86.sh
      firmware_tag: immortalwrt-24.10-x86
      firmware_pattern: '*squashfs-combined*.img.gz'
      firmware_description: without Docker
      default_ip: 192.168.15.1
      autoupdate_source: Immortalwrt
      autoupdate_edition: '24.10'
      autoupdate_tag: Update-immortalwrt-24.10-x86
      notify_wechat: true
      notify_telegram: true
    secrets: inherit
