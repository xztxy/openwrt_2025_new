name: immortalwrt-24.10-x86

on:
  repository_dispatch:
    types:
      - immortalwrt-updated
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  build:
    uses: ./.github/workflows/_build-openwrt.yml
    with:
      source_url: https://github.com/immortalwrt/immortalwrt
      source_branch: openwrt-24.10
      config_file: configs/immortalwrt_24.10_x86.config
      diy_part1: scripts/sh/immortalwrt_diy-part1.sh
      diy_part2: scripts/immortalwrt_24.10_x86.sh
      firmware_tag: immortalwrt-24.10-x86
      firmware_pattern: '*squashfs-combined*.img.gz'
      firmware_description: without Docker
      default_ip: 192.168.15.1
      notify_wechat: true
      notify_telegram: true
    secrets: inherit
