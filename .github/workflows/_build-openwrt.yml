name: Reusable OpenWrt Build

on:
  workflow_call:
    inputs:
      source_url:
        required: true
        type: string
      source_branch:
        required: true
        type: string
      target_board:
        required: true
        type: string
      target_subtarget:
        required: true
        type: string
      config_file:
        required: true
        type: string
      diy_part1:
        required: true
        type: string
      diy_part2:
        required: true
        type: string
      firmware_tag:
        required: true
        type: string
      firmware_pattern:
        required: false
        default: '*squashfs-combined*.img.gz'
        type: string
      firmware_description:
        required: true
        type: string
      default_ip:
        required: false
        default: '192.168.15.1'
        type: string
      autoupdate_source:
        required: true
        type: string
      autoupdate_edition:
        required: true
        type: string
      autoupdate_tag:
        required: false
        default: 'Update-x86'
        type: string
      notify_wechat:
        required: false
        default: false
        type: boolean
      notify_telegram:
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  actions: write

concurrency:
  group: openwrt-${{ inputs.firmware_tag }}
  cancel-in-progress: false

env:
  TZ: Asia/Shanghai
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Checkout build configuration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -Eeuo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true
          sudo apt-get remove -y needrestart || true
          sudo apt-get update
          xargs -a "$GITHUB_WORKSPACE/depends_ubuntu_2404" sudo apt-get install -y --no-install-recommends
          sudo apt-get autoremove --purge -y
          sudo apt-get clean
          sudo timedatectl set-timezone "$TZ"

          clang++ --version
          g++ --version
          clang_major="$(clang++ --version | sed -n '1s/.*version \([0-9][0-9]*\).*/\1/p')"
          if [[ -z "$clang_major" || "$clang_major" -lt 18 ]]; then
            echo "Clang 18 or newer is required; detected: ${clang_major:-unknown}" >&2
            exit 1
          fi

          sudo mkdir -p /workdir
          sudo chown "$USER":"$(id -gn)" /workdir

      - name: Clone firmware source
        working-directory: /workdir
        env:
          SOURCE_URL: ${{ inputs.source_url }}
          SOURCE_BRANCH: ${{ inputs.source_branch }}
        run: |
          set -Eeuo pipefail
          git clone --depth 1 --branch "$SOURCE_BRANCH" --single-branch "$SOURCE_URL" openwrt
          ln -s /workdir/openwrt "$GITHUB_WORKSPACE/openwrt"
          cd openwrt

          source_repo="${SOURCE_URL##*/}"
          source_repo="${source_repo%.git}"
          device_target="${{ inputs.target_board }}"
          device_subtarget="${{ inputs.target_subtarget }}"
          [[ -n "$device_target" && -n "$device_subtarget" ]]

          {
            printf 'OPENWRT_PATH=%s\n' "$PWD"
            printf 'SOURCE_REPO=%s\n' "$source_repo"
            printf 'DEVICE_TARGET=%s\n' "$device_target"
            printf 'DEVICE_SUBTARGET=%s\n' "$device_subtarget"
            printf 'COMMIT_AUTHOR=%s\n' "$(git show -s --format='%an')"
            printf 'COMMIT_DATE=%s\n' "$(git show -s --format='%ci')"
            printf 'COMMIT_MESSAGE=%s\n' "$(git show -s --format='%s')"
            printf 'COMMIT_HASH=%s\n' "$(git rev-parse HEAD)"
          } >> "$GITHUB_ENV"

      - name: Restore build cache
        uses: HiGarfield/cachewrtbuild@3c396d6d42253c392a1c7c2ca996869c3d5b5853
        with:
          ccache: true
          toolchain: true
          skip: true
          mixkey: ubuntu-24.04-v1-${{ env.SOURCE_REPO }}-${{ inputs.source_branch }}-${{ env.DEVICE_TARGET }}-${{ env.DEVICE_SUBTARGET }}

      - name: Prepare feeds
        run: |
          set -Eeuo pipefail
          cd "$OPENWRT_PATH"
          bash "$GITHUB_WORKSPACE/${{ inputs.diy_part1 }}"
          ./scripts/feeds update -a
          ./scripts/feeds install -a
      - name: Apply firmware configuration
        env:
          AUTOUPDATE_SOURCE: ${{ inputs.autoupdate_source }}
          AUTOUPDATE_EDITION: ${{ inputs.autoupdate_edition }}
          AUTOUPDATE_TAG: ${{ inputs.autoupdate_tag }}
        run: |
          set -Eeuo pipefail
          cd "$OPENWRT_PATH"
          cp "$GITHUB_WORKSPACE/${{ inputs.config_file }}" .config
          bash "$GITHUB_WORKSPACE/${{ inputs.diy_part2 }}"
          make defconfig

          compile_date="$(date +'%Y%m%d%H%M')"
          target_profile="${DEVICE_TARGET}-${DEVICE_SUBTARGET}"
          current_firmware="${AUTOUPDATE_SOURCE}-${AUTOUPDATE_EDITION}-${target_profile}-${compile_date}"
          metadata_path="$OPENWRT_PATH/package/base-files/files/etc/openwrt_autoupdate"
          mkdir -p "$(dirname "$metadata_path")"
          cat > "$metadata_path" <<EOF
          GITHUB_REPOSITORY="$GITHUB_REPOSITORY"
          GITHUB_REPOSITORY_URL="https://github.com/$GITHUB_REPOSITORY"
          GITHUB_RELEASE_URL="https://github.com/$GITHUB_REPOSITORY/releases/tag/$AUTOUPDATE_TAG"
          GITHUB_RELEASE_DOWNLOAD_URL="https://github.com/$GITHUB_REPOSITORY/releases/download/$AUTOUPDATE_TAG"
          GITHUB_TAG="$AUTOUPDATE_TAG"
          GITHUB_API="zzz_api"
          GITHUB_API_URL_ORIGIN="https://github.com/$GITHUB_REPOSITORY/releases/download/$AUTOUPDATE_TAG/zzz_api"
          GITHUB_API_URL_FASTGIT="https://github.com/$GITHUB_REPOSITORY/releases/download/$AUTOUPDATE_TAG/zzz_api"
          GITHUB_API_URL_GHPROXY="https://ghfast.top/https://github.com/$GITHUB_REPOSITORY/releases/download/$AUTOUPDATE_TAG/zzz_api"
          FRIMWARE_URL_ORIGIN="https://github.com/$GITHUB_REPOSITORY/releases/download/$AUTOUPDATE_TAG"
          FRIMWARE_URL_GHPROXY="https://ghfast.top/https://github.com/$GITHUB_REPOSITORY/releases/download/$AUTOUPDATE_TAG"
          SOURCE="$AUTOUPDATE_SOURCE"
          TARGET_PROFILE="$target_profile"
          TARGET_BOARD="$DEVICE_TARGET"
          TARGET_SUBTARGET="$DEVICE_SUBTARGET"
          LUCI_EDITION="$AUTOUPDATE_EDITION"
          COMPILE_DATE="$compile_date"
          FIRMWARE_EXT=".img.gz"
          FIRMWARE_BRIEF="${AUTOUPDATE_SOURCE}-${target_profile}-${compile_date}"
          FIRMWARE_NAME_PREFIX="${AUTOUPDATE_SOURCE}-${AUTOUPDATE_EDITION}-${target_profile}"
          CURRENT_FIRMWARE="$current_firmware"
          AUTOUPDATE_VERSION="owned-zzz-api-v1"
          FILES_TO_DELETE="/etc/default_delete"
          EOF
          chmod 0755 "$metadata_path"
          {
            printf 'COMPILE_DATE=%s\n' "$compile_date"
            printf 'TARGET_PROFILE=%s\n' "$target_profile"
            printf 'CURRENT_FIRMWARE=%s\n' "$current_firmware"
            printf 'AUTOUPDATE_TAG=%s\n' "$AUTOUPDATE_TAG"
            printf 'AUTOUPDATE_SOURCE=%s\n' "$AUTOUPDATE_SOURCE"
            printf 'AUTOUPDATE_EDITION=%s\n' "$AUTOUPDATE_EDITION"
          } >> "$GITHUB_ENV"

      - name: Download source archives
        run: |
          set -Eeuo pipefail
          cd "$OPENWRT_PATH"
          if ! make download -j"$(nproc)"; then
            make download -j1 V=s
          fi
          find dl -type f -size -1024c -print -delete

      - name: Compile firmware
        id: compile
        run: |
          set -Eeuo pipefail
          cd "$OPENWRT_PATH"
          echo "Compiling with $(nproc) threads"
          if ! make -j"$(nproc)" FORCE_UNSAFE_CONFIGURE=1; then
            echo "Parallel build failed; retrying once with verbose single-thread output"
            make -j1 V=s FORCE_UNSAFE_CONFIGURE=1
          fi
          printf 'status=success\n' >> "$GITHUB_OUTPUT"
          printf 'DATE=%s\n' "$(date +'%Y-%m-%d %H:%M:%S')" >> "$GITHUB_ENV"
          printf 'FILE_DATE=%s\n' "$(date +'%Y.%m.%d')" >> "$GITHUB_ENV"

      - name: Collect firmware files
        id: collect
        env:
          FIRMWARE_PATTERN: ${{ inputs.firmware_pattern }}
          FIRMWARE_TAG: ${{ inputs.firmware_tag }}
        run: |
          set -Eeuo pipefail
          output_dir="$GITHUB_WORKSPACE/outputs/$FIRMWARE_TAG"
          rm -rf "$output_dir"
          mkdir -p "$output_dir"

          mapfile -d '' firmware_files < <(
            find "$OPENWRT_PATH/bin/targets" -type f -name "$FIRMWARE_PATTERN" -print0
          )
          if [[ "${#firmware_files[@]}" -eq 0 ]]; then
            echo "No firmware files matched: $FIRMWARE_PATTERN" >&2
            exit 1
          fi

          for firmware in "${firmware_files[@]}"; do
            cp "$firmware" "$output_dir/${FILE_DATE}_$(basename "$firmware")"
          done
          (
            cd "$output_dir"
            sha256sum -- * > SHA256SUMS
          )

          printf 'OUTPUT_DIR=%s\n' "$output_dir" >> "$GITHUB_ENV"
          printf 'output_dir=%s\n' "$output_dir" >> "$GITHUB_OUTPUT"

      - name: Prepare zzz_api update firmware
        id: autoupdate
        run: |
          set -Eeuo pipefail
          update_dir="$GITHUB_WORKSPACE/outputs/$AUTOUPDATE_TAG"
          rm -rf "$update_dir"
          mkdir -p "$update_dir"

          mapfile -d '' update_candidates < <(
            find "$OPENWRT_PATH/bin/targets" -type f -name '*squashfs-combined*.img.gz' -print0
          )
          if [[ "${#update_candidates[@]}" -eq 0 ]]; then
            echo "No x86 squashfs combined firmware found for zzz_api channel" >&2
            exit 1
          fi

          for firmware in "${update_candidates[@]}"; do
            base_name="$(basename "$firmware")"
            case "$base_name" in
              *efi*) boot_type=uefi ;;
              *) boot_type=legacy ;;
            esac
            checksum="$(md5sum "$firmware" | cut -c1-3)$(sha256sum "$firmware" | cut -c1-3)"
            update_name="${AUTOUPDATE_EDITION}-${AUTOUPDATE_SOURCE}-${TARGET_PROFILE}-${COMPILE_DATE}-${boot_type}-${checksum}.img.gz"
            cp "$firmware" "$update_dir/$update_name"
          done

          printf 'AUTOUPDATE_DIR=%s\n' "$update_dir" >> "$GITHUB_ENV"
          printf 'update_dir=%s\n' "$update_dir" >> "$GITHUB_OUTPUT"

      - name: Upload firmware artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.firmware_tag }}-${{ env.FILE_DATE }}
          path: ${{ steps.collect.outputs.output_dir }}
          if-no-files-found: error
          retention-days: 7

      - name: Publish firmware release
        env:
          GH_TOKEN: ${{ github.token }}
          FIRMWARE_TAG: ${{ inputs.firmware_tag }}
          FIRMWARE_DESCRIPTION: ${{ inputs.firmware_description }}
          DEFAULT_IP: ${{ inputs.default_ip }}
          SOURCE_URL: ${{ inputs.source_url }}
        run: |
          set -Eeuo pipefail
          release_title="R${DATE} for ${FIRMWARE_TAG}"
          release_notes="$(cat <<EOF
          OpenWrt firmware for ${FIRMWARE_TAG}

          - Platform: ${DEVICE_TARGET}-${DEVICE_SUBTARGET}
          - Profile: ${FIRMWARE_DESCRIPTION}
          - Default address: ${DEFAULT_IP}
          - Default password: empty
          - Source: ${SOURCE_URL}
          - Source author: ${COMMIT_AUTHOR}
          - Source date: ${COMMIT_DATE}
          - Source commit: ${COMMIT_HASH}
          - Source message: ${COMMIT_MESSAGE}
          EOF
          )"

          if gh release view "$FIRMWARE_TAG" >/dev/null 2>&1; then
            gh release edit "$FIRMWARE_TAG" --title "$release_title" --notes "$release_notes"
          else
            gh release create "$FIRMWARE_TAG" --title "$release_title" --notes "$release_notes"
          fi
          gh release upload "$FIRMWARE_TAG" "$OUTPUT_DIR"/* --clobber

      - name: Publish zzz_api update channel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          update_notes="OpenWrt online update channel backed by zzz_api."
          if gh release view "$AUTOUPDATE_TAG" >/dev/null 2>&1; then
            gh release edit "$AUTOUPDATE_TAG" --title "OpenWrt AutoUpdate x86" --notes "$update_notes"
          else
            gh release create "$AUTOUPDATE_TAG" --title "OpenWrt AutoUpdate x86" --notes "$update_notes"
          fi

          gh release upload "$AUTOUPDATE_TAG" "$AUTOUPDATE_DIR"/* --clobber
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$AUTOUPDATE_TAG" > "$AUTOUPDATE_DIR/zzz_api"
          gh release upload "$AUTOUPDATE_TAG" "$AUTOUPDATE_DIR/zzz_api" --clobber

      - name: Notify WeCom
        if: success() && inputs.notify_wechat
        continue-on-error: true
        env:
          WECHAT_WORK_URL: ${{ secrets.WECHAT_WORK_URL }}
          WECHAT_WORK_TOKEN: ${{ secrets.WECHAT_WORK_TOKEN }}
          FIRMWARE_TAG: ${{ inputs.firmware_tag }}
        run: |
          set -Eeuo pipefail
          if [[ -z "${WECHAT_WORK_URL:-}" || -z "${WECHAT_WORK_TOKEN:-}" ]]; then
            echo "WeCom notification secrets are not configured; skipping"
            exit 0
          fi
          message="${FIRMWARE_TAG} firmware compiled successfully. Release: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${FIRMWARE_TAG}"
          wechat_endpoint="${WECHAT_WORK_URL%/}"
          case "$wechat_endpoint" in
            http://*|https://*) ;;
            *) wechat_endpoint="http://${wechat_endpoint}" ;;
          esac
          if [[ "$wechat_endpoint" != */push ]]; then
            wechat_endpoint="${wechat_endpoint}/push"
          fi
          curl --fail --silent --show-error --retry 3 --get \
            "$wechat_endpoint" \
            --data-urlencode "token=${WECHAT_WORK_TOKEN}" \
            --data-urlencode "message=${message}"

      - name: Notify Telegram
        if: success() && inputs.notify_telegram
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FIRMWARE_TAG: ${{ inputs.firmware_tag }}
        run: |
          set -Eeuo pipefail
          if [[ -z "${TELEGRAM_BOT_TOKEN:-}" || -z "${TELEGRAM_CHAT_ID:-}" ]]; then
            echo "Telegram notification secrets are not configured; skipping"
            exit 0
          fi
          message="${FIRMWARE_TAG} firmware compiled successfully. Release: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${FIRMWARE_TAG}"
          curl --fail --silent --show-error --retry 3 \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${message}"

      - name: Show disk usage
        if: always()
        run: df -hT
