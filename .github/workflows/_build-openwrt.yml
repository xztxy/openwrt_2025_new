name: Reusable OpenWrt Build

on:
  workflow_call:
    inputs:
      source_url:
        required: true
        type: string
      source_branch:
        required: true
        type: string
      target_board:
        required: true
        type: string
      target_subtarget:
        required: true
        type: string
      config_file:
        required: true
        type: string
      diy_part1:
        required: true
        type: string
      diy_part2:
        required: true
        type: string
      firmware_tag:
        required: true
        type: string
      firmware_pattern:
        required: false
        default: '*squashfs-combined*.img.gz'
        type: string
      firmware_description:
        required: true
        type: string
      default_ip:
        required: false
        default: '192.168.15.1'
        type: string
      notify_wechat:
        required: false
        default: false
        type: boolean
      notify_telegram:
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  actions: write

concurrency:
  group: openwrt-${{ inputs.firmware_tag }}
  cancel-in-progress: false

env:
  TZ: Asia/Shanghai
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Checkout build configuration
        uses: actions/checkout@v4

      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -Eeuo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true
          sudo apt-get remove -y needrestart || true
          sudo apt-get update
          xargs -a "$GITHUB_WORKSPACE/depends_ubuntu_2404" sudo apt-get install -y --no-install-recommends
          sudo apt-get autoremove --purge -y
          sudo apt-get clean
          sudo timedatectl set-timezone "$TZ"

          clang++ --version
          g++ --version
          clang_major="$(clang++ --version | sed -n '1s/.*version \([0-9][0-9]*\).*/\1/p')"
          if [[ -z "$clang_major" || "$clang_major" -lt 18 ]]; then
            echo "Clang 18 or newer is required; detected: ${clang_major:-unknown}" >&2
            exit 1
          fi

          sudo mkdir -p /workdir
          sudo chown "$USER":"$(id -gn)" /workdir

      - name: Clone firmware source
        working-directory: /workdir
        env:
          SOURCE_URL: ${{ inputs.source_url }}
          SOURCE_BRANCH: ${{ inputs.source_branch }}
        run: |
          set -Eeuo pipefail
          git clone --depth 1 --branch "$SOURCE_BRANCH" --single-branch "$SOURCE_URL" openwrt
          ln -s /workdir/openwrt "$GITHUB_WORKSPACE/openwrt"
          cd openwrt

          source_repo="${SOURCE_URL##*/}"
          source_repo="${source_repo%.git}"
          device_target="${{ inputs.target_board }}"
          device_subtarget="${{ inputs.target_subtarget }}"
          [[ -n "$device_target" && -n "$device_subtarget" ]]

          {
            printf 'OPENWRT_PATH=%s\n' "$PWD"
            printf 'SOURCE_REPO=%s\n' "$source_repo"
            printf 'DEVICE_TARGET=%s\n' "$device_target"
            printf 'DEVICE_SUBTARGET=%s\n' "$device_subtarget"
            printf 'COMMIT_AUTHOR=%s\n' "$(git show -s --format='%an')"
            printf 'COMMIT_DATE=%s\n' "$(git show -s --format='%ci')"
            printf 'COMMIT_MESSAGE=%s\n' "$(git show -s --format='%s')"
            printf 'COMMIT_HASH=%s\n' "$(git rev-parse HEAD)"
          } >> "$GITHUB_ENV"

      - name: Restore build cache
        uses: HiGarfield/cachewrtbuild@3c396d6d42253c392a1c7c2ca996869c3d5b5853
        with:
          ccache: true
          toolchain: true
          skip: true
          mixkey: ubuntu-24.04-v1-${{ env.SOURCE_REPO }}-${{ inputs.source_branch }}-${{ env.DEVICE_TARGET }}-${{ env.DEVICE_SUBTARGET }}
          prefix: ${{ env.OPENWRT_PATH }}

      - name: Prepare feeds
        run: |
          set -Eeuo pipefail
          cd "$OPENWRT_PATH"
          bash "$GITHUB_WORKSPACE/${{ inputs.diy_part1 }}"
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Apply firmware configuration
        run: |
          set -Eeuo pipefail
          cd "$OPENWRT_PATH"
          cp "$GITHUB_WORKSPACE/${{ inputs.config_file }}" .config
          bash "$GITHUB_WORKSPACE/${{ inputs.diy_part2 }}"
          make defconfig

      - name: Download source archives
        run: |
          set -Eeuo pipefail
          cd "$OPENWRT_PATH"
          if ! make download -j"$(nproc)"; then
            make download -j1 V=s
          fi
          find dl -type f -size -1024c -print -delete

      - name: Compile firmware
        id: compile
        run: |
          set -Eeuo pipefail
          cd "$OPENWRT_PATH"
          echo "Compiling with $(nproc) threads"
          if ! make -j"$(nproc)" FORCE_UNSAFE_CONFIGURE=1; then
            echo "Parallel build failed; retrying once with verbose single-thread output"
            make -j1 V=s FORCE_UNSAFE_CONFIGURE=1
          fi
          printf 'status=success\n' >> "$GITHUB_OUTPUT"
          printf 'DATE=%s\n' "$(date +'%Y-%m-%d %H:%M:%S')" >> "$GITHUB_ENV"
          printf 'FILE_DATE=%s\n' "$(date +'%Y.%m.%d')" >> "$GITHUB_ENV"

      - name: Collect firmware files
        id: collect
        env:
          FIRMWARE_PATTERN: ${{ inputs.firmware_pattern }}
          FIRMWARE_TAG: ${{ inputs.firmware_tag }}
        run: |
          set -Eeuo pipefail
          output_dir="$GITHUB_WORKSPACE/outputs/$FIRMWARE_TAG"
          rm -rf "$output_dir"
          mkdir -p "$output_dir"

          mapfile -d '' firmware_files < <(
            find "$OPENWRT_PATH/bin/targets" -type f -name "$FIRMWARE_PATTERN" -print0
          )
          if [[ "${#firmware_files[@]}" -eq 0 ]]; then
            echo "No firmware files matched: $FIRMWARE_PATTERN" >&2
            exit 1
          fi

          for firmware in "${firmware_files[@]}"; do
            cp "$firmware" "$output_dir/${FILE_DATE}_$(basename "$firmware")"
          done
          (
            cd "$output_dir"
            sha256sum -- * > SHA256SUMS
          )

          printf 'OUTPUT_DIR=%s\n' "$output_dir" >> "$GITHUB_ENV"
          printf 'output_dir=%s\n' "$output_dir" >> "$GITHUB_OUTPUT"

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.firmware_tag }}-${{ env.FILE_DATE }}
          path: ${{ steps.collect.outputs.output_dir }}
          if-no-files-found: error
          retention-days: 7

      - name: Publish firmware release
        env:
          GH_TOKEN: ${{ github.token }}
          FIRMWARE_TAG: ${{ inputs.firmware_tag }}
          FIRMWARE_DESCRIPTION: ${{ inputs.firmware_description }}
          DEFAULT_IP: ${{ inputs.default_ip }}
          SOURCE_URL: ${{ inputs.source_url }}
        run: |
          set -Eeuo pipefail
          release_title="R${DATE} for ${FIRMWARE_TAG}"
          release_notes="$(cat <<EOF
          OpenWrt firmware for ${FIRMWARE_TAG}

          - Platform: ${DEVICE_TARGET}-${DEVICE_SUBTARGET}
          - Profile: ${FIRMWARE_DESCRIPTION}
          - Default address: ${DEFAULT_IP}
          - Default password: empty
          - Source: ${SOURCE_URL}
          - Source author: ${COMMIT_AUTHOR}
          - Source date: ${COMMIT_DATE}
          - Source commit: ${COMMIT_HASH}
          - Source message: ${COMMIT_MESSAGE}
          EOF
          )"

          if gh release view "$FIRMWARE_TAG" >/dev/null 2>&1; then
            gh release edit "$FIRMWARE_TAG" --title "$release_title" --notes "$release_notes"
          else
            gh release create "$FIRMWARE_TAG" --title "$release_title" --notes "$release_notes"
          fi
          gh release upload "$FIRMWARE_TAG" "$OUTPUT_DIR"/* --clobber

      - name: Notify WeCom
        if: success() && inputs.notify_wechat
        continue-on-error: true
        env:
          WECHAT_WORK_URL: ${{ secrets.WECHAT_WORK_URL }}
          WECHAT_WORK_TOKEN: ${{ secrets.WECHAT_WORK_TOKEN }}
          FIRMWARE_TAG: ${{ inputs.firmware_tag }}
        run: |
          set -Eeuo pipefail
          if [[ -z "${WECHAT_WORK_URL:-}" || -z "${WECHAT_WORK_TOKEN:-}" ]]; then
            echo "WeCom notification secrets are not configured; skipping"
            exit 0
          fi
          message="${FIRMWARE_TAG} firmware compiled successfully. Release: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${FIRMWARE_TAG}"
          wechat_endpoint="${WECHAT_WORK_URL%/}"
          case "$wechat_endpoint" in
            http://*|https://*) ;;
            *) wechat_endpoint="http://${wechat_endpoint}" ;;
          esac
          if [[ "$wechat_endpoint" != */push ]]; then
            wechat_endpoint="${wechat_endpoint}/push"
          fi
          curl --fail --silent --show-error --retry 3 --get \
            "$wechat_endpoint" \
            --data-urlencode "token=${WECHAT_WORK_TOKEN}" \
            --data-urlencode "message=${message}"

      - name: Notify Telegram
        if: success() && inputs.notify_telegram
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FIRMWARE_TAG: ${{ inputs.firmware_tag }}
        run: |
          set -Eeuo pipefail
          if [[ -z "${TELEGRAM_BOT_TOKEN:-}" || -z "${TELEGRAM_CHAT_ID:-}" ]]; then
            echo "Telegram notification secrets are not configured; skipping"
            exit 0
          fi
          message="${FIRMWARE_TAG} firmware compiled successfully. Release: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${FIRMWARE_TAG}"
          curl --fail --silent --show-error --retry 3 \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${message}"

      - name: Show disk usage
        if: always()
        run: df -hT
