name: Reusable Upstream Checker

on:
  workflow_call:
    inputs:
      primary_ref:
        required: true
        type: string
      upstream_refs:
        required: true
        type: string
      build_targets:
        required: true
        type: string
      configuration_paths:
        required: true
        type: string
      force_build:
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  actions: write

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout build configuration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve upstream fingerprint
        id: upstream
        env:
          PRIMARY_REF: ${{ inputs.primary_ref }}
          UPSTREAM_REFS: ${{ inputs.upstream_refs }}
          CONFIGURATION_PATHS: ${{ inputs.configuration_paths }}
        run: |
          set -Eeuo pipefail
          state_file="$(mktemp)"
          primary_commit=""

          while IFS= read -r configuration_path; do
            [[ -z "$configuration_path" || "$configuration_path" == \#* ]] && continue
            matched=0
            while IFS= read -r tracked_file; do
              [[ -z "$tracked_file" ]] && continue
              read -r file_hash _ < <(sha256sum "$tracked_file")
              printf 'configuration:%s\t%s\n' "$tracked_file" "$file_hash" >> "$state_file"
              matched=1
            done < <(git ls-files -- "$configuration_path")
            if (( matched == 0 )); then
              echo "Configuration path matched no tracked files: $configuration_path" >&2
              exit 1
            fi
          done <<< "$CONFIGURATION_PATHS"

          while IFS= read -r upstream_ref; do
            [[ -z "$upstream_ref" || "$upstream_ref" == \#* ]] && continue
            repository="${upstream_ref%%:*}"
            branch="${upstream_ref#*:}"
            if [[ -z "$repository" || -z "$branch" || "$repository" == "$branch" ]]; then
              echo "Invalid upstream reference: $upstream_ref" >&2
              exit 1
            fi

            commit_hash=""
            for attempt in 1 2 3; do
              commit_hash="$(
                git ls-remote "https://github.com/${repository}.git" "refs/heads/${branch}" |
                  cut -f1
              )"
              [[ "$commit_hash" =~ ^[0-9a-f]{40}$ ]] && break
              echo "Unable to resolve $upstream_ref (attempt $attempt/3)" >&2
              sleep "$attempt"
            done
            if [[ ! "$commit_hash" =~ ^[0-9a-f]{40}$ ]]; then
              echo "Unable to resolve upstream reference: $upstream_ref" >&2
              exit 1
            fi

            printf '%s\t%s\n' "$upstream_ref" "$commit_hash" >> "$state_file"
            if [[ "$upstream_ref" == "$PRIMARY_REF" ]]; then
              primary_commit="$commit_hash"
            fi
          done <<< "$UPSTREAM_REFS"

          if [[ ! "$primary_commit" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Primary reference was not resolved: $PRIMARY_REF" >&2
            exit 1
          fi

          LC_ALL=C sort -u "$state_file" -o "$state_file"
          read -r fingerprint _ < <(sha256sum "$state_file")
          {
            echo "### Upstream fingerprint"
            echo
            echo "- Primary commit: \`$primary_commit\`"
            echo "- Combined fingerprint: \`$fingerprint\`"
            echo
            echo '| Source | Commit |'
            echo '| --- | --- |'
            while IFS=$'\t' read -r upstream_ref commit_hash; do
              printf "| \`%s\` | \`%s\` |\n" "$upstream_ref" "$commit_hash"
            done < "$state_file"
          } >> "$GITHUB_STEP_SUMMARY"

          printf 'source_commit=%s\n' "$primary_commit" >> "$GITHUB_OUTPUT"
          printf 'fingerprint=%s\n' "$fingerprint" >> "$GITHUB_OUTPUT"

      - name: Dispatch missing builds
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_TARGETS: ${{ inputs.build_targets }}
          FORCE_BUILD: ${{ inputs.force_build }}
          SOURCE_COMMIT: ${{ steps.upstream.outputs.source_commit }}
          FINGERPRINT: ${{ steps.upstream.outputs.fingerprint }}
        run: |
          set -Eeuo pipefail
          dispatched=0

          while IFS='|' read -r target event_type state_release; do
            [[ -z "$target" || "$target" == \#* ]] && continue
            if [[ -z "$event_type" || -z "$state_release" ]]; then
              echo "Invalid build target entry: $target" >&2
              exit 1
            fi

            state_asset="build-state-${FINGERPRINT}"
            if [[ "$FORCE_BUILD" != "true" ]]; then
              if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$state_release" \
                --jq ".assets[] | select(.name == \"$state_asset\") | .id" 2>/dev/null |
                sed -n '1p' | grep -q .; then
                echo "$target already built for $FINGERPRINT"
                continue
              fi

              duplicate_run="$(
                gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs?per_page=100" \
                  --jq ".workflow_runs[] | select((.status == \"queued\" or .status == \"in_progress\" or .status == \"pending\" or .status == \"waiting\" or .status == \"requested\") and (.display_title | endswith(\"[$target:$FINGERPRINT]\"))) | .id" |
                  sed -n '1p'
              )"
              if [[ -n "$duplicate_run" ]]; then
                echo "$target already queued or running for $FINGERPRINT (run $duplicate_run)"
                continue
              fi
            fi

            echo "Dispatching $target for $FINGERPRINT"
            gh api --method POST "repos/$GITHUB_REPOSITORY/dispatches" \
              -f event_type="$event_type" \
              -F "client_payload[target]=$target" \
              -F "client_payload[source_commit]=$SOURCE_COMMIT" \
              -F "client_payload[fingerprint]=$FINGERPRINT" \
              -F "client_payload[state_release]=$state_release"
            dispatched=$((dispatched + 1))
          done <<< "$BUILD_TARGETS"

          if (( dispatched == 0 )); then
            echo "Every target is already built for the current upstream fingerprint"
          fi
