name: lede-x86-OpenWrt

on:
  repository_dispatch:
    types:
      - lede-updated
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.event.client_payload.target == 'lede-x86'
    uses: ./.github/workflows/_build-openwrt.yml
    with:
      source_url: https://github.com/coolsnowwolf/lede
      source_branch: master
      source_commit: ${{ github.event.client_payload.source_commit }}
      build_fingerprint: ${{ github.event.client_payload.fingerprint }}
      target_board: x86
      target_subtarget: '64'
      config_file: configs/lede_x86.config
      diy_part1: scripts/sh/lede_diy-part1
      diy_part2: scripts/lede_x86
      firmware_tag: lede-x86
      firmware_pattern: '*squashfs-combined*.img.gz'
      firmware_description: LEDE x86_64
      default_ip: 192.168.15.1
      autoupdate_source: Lede
      autoupdate_edition: '23.05'
      autoupdate_tag: Update-lede-x86
      notify_wechat: true
      notify_telegram: true
    secrets: inherit
